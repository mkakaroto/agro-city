<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6e4520">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agro City">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Agro City</title>
<style>
@font-face{font-family:'Fredoka';font-weight:400;src:url(fonts/fredoka-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-weight:500 600;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-weight:700;src:url(fonts/fredoka-latin-700-normal.woff2) format('woff2')}
html,body{overscroll-behavior:none;touch-action:manipulation}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Fredoka',system-ui,sans-serif;color:#3b2a14;min-height:100vh;
 background:#7cc04b repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 12px,transparent 12px 24px);user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none}
#top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));background:linear-gradient(#8a5a2b,#6e4520);color:#fff;border-bottom:4px solid #4a2e13;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.brand{font-weight:700;font-size:22px;margin-right:auto;text-shadow:0 2px 0 #4a2e13}
.stat{background:rgba(0,0,0,.25);padding:5px 12px;border-radius:20px;font-weight:600;display:flex;align-items:center;gap:6px}
.lvl #lv{background:#ffcc33;color:#5a3a00;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:700}
.xpbar{position:relative;width:120px;height:16px;background:#3a2410;border-radius:8px;overflow:hidden}
#xpfill{height:100%;background:linear-gradient(#9cf06a,#4fb320);width:0;transition:width .4s}
#xptxt{position:absolute;inset:0;font-size:11px;display:grid;place-items:center}
main{display:flex;gap:16px;padding:16px;max-width:1200px;margin:0 auto;align-items:flex-start}
#farmwrap{flex:1;min-width:0}
#farmhead{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff8e6;border-radius:12px 12px 0 0;padding:8px 14px;font-weight:600;border:3px solid #a8743d;border-bottom:none}
#farmhead button{background:#e8833a;color:#fff;padding:6px 14px;border-radius:16px;font-weight:600}
#farm{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:14px;background:#5a9e33;border:3px solid #a8743d;
 background-image:radial-gradient(rgba(255,255,255,.08) 2px,transparent 2px);background-size:14px 14px;
 box-shadow:inset 0 0 0 6px #c99456, inset 0 0 0 9px #8a5a2b}
.plot{position:relative;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;cursor:pointer;
 background:#8b5a2b repeating-linear-gradient(0deg,#7a4c22 0 5px,#93602f 5px 11px);box-shadow:0 4px 0 #4f3014, inset 0 0 0 2px rgba(0,0,0,.15);transition:transform .1s}
.plot:hover{transform:translateY(-2px)}
.plot:active{transform:translateY(2px);box-shadow:0 2px 0 #4f3014}
.plot.sel{outline:3px solid #ffe066;outline-offset:2px}
.plot.dry{background:#b38552 repeating-linear-gradient(0deg,#a77a48 0 5px,#c09160 5px 11px)}
.plot.locked{background:#6aa83f;box-shadow:0 4px 0 #3f7020;border:2px dashed rgba(255,255,255,.5);color:#fff;font-size:12px;text-align:center;line-height:1.2}
.plot.locked b{font-size:22px;display:block}
.plot .e{font-size:min(6.5vw,42px);line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.plot .e.st0{font-size:min(3vw,18px)}.plot .e.st1{font-size:min(4.5vw,28px)}.plot .e.st3{font-size:min(5vw,32px);opacity:.85}
.plot .e.ripe{animation:bob 1.2s ease-in-out infinite}
.plot .e.weeds{font-size:min(3.6vw,22px);line-height:1.1;text-align:center}
.plot .e.dead{filter:grayscale(.7) drop-shadow(0 2px 1px rgba(0,0,0,.3))}
@keyframes bob{50%{transform:translateY(-4px) scale(1.08)}}
.probs{position:absolute;top:2px;left:3px;font-size:min(3vw,15px);line-height:1}
.drop{position:absolute;top:2px;right:3px;font-size:min(3vw,15px);animation:bob 1s infinite}
.pbar{position:absolute;left:8%;right:8%;bottom:6%;height:5px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:#9cf06a}
.left{position:absolute;bottom:3px;right:5px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
#info{background:#fff8e6;border:3px solid #a8743d;border-top:none;border-radius:0 0 12px 12px;padding:8px 14px;min-height:40px;font-size:14px}
#tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tool{background:#fff8e6;border:3px solid #c99456;border-radius:12px;padding:6px 10px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:5px;color:#3b2a14}
.tool span{font-size:20px}
.tool.on{background:#ffe066;border-color:#e0a800;transform:translateY(-2px);box-shadow:0 3px 0 #b88600}
#seedbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;font-size:14px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.chip{background:#fff;color:#3b2a14;border-radius:16px;padding:4px 10px;border:2px solid transparent;text-shadow:none;font-weight:600}
.chip.on{border-color:#e8833a;background:#ffe9d6}
#panel{width:340px;flex-shrink:0;background:#fff8e6;border:3px solid #a8743d;border-radius:14px;overflow:hidden;position:sticky;top:12px}
#panel nav{display:flex;background:#c99456}
#panel nav button{flex:1;padding:10px 4px;background:none;color:#fff;font-weight:600;font-size:14px}
#panel nav button.on{background:#fff8e6;color:#6e4520}
#tab{padding:12px;max-height:calc(100vh - 140px);overflow:auto}
.card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:#fff;margin-bottom:8px;box-shadow:0 2px 0 #e5d3b0}
.card .ic{font-size:30px;width:40px;text-align:center}
.card .tx{flex:1;font-size:13px;line-height:1.35}
.card .tx b{font-size:15px}
.card.off{opacity:.5}
.btn{background:#5aa82e;color:#fff;border-radius:10px;padding:6px 10px;font-weight:600;font-size:13px;box-shadow:0 3px 0 #3c7a1b}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3c7a1b}
.btn.o{background:#e8833a;box-shadow:0 3px 0 #b05a1c}
.btn.r{background:#d9534f;box-shadow:0 3px 0 #a13330}
.btn:disabled{background:#bbb;box-shadow:0 3px 0 #999;cursor:not-allowed}
.bs{display:flex;flex-direction:column;gap:5px}
h3{font-size:16px;margin:4px 0 8px;color:#6e4520}
.help p{font-size:14px;line-height:1.5;margin-bottom:8px}
.empty{font-size:14px;color:#8a6a40;text-align:center;padding:20px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.fly{position:absolute;font-weight:700;font-size:16px;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.6);animation:fly 1.1s ease-out forwards;white-space:nowrap}
@keyframes fly{to{transform:translateY(-50px);opacity:0}}
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;align-items:center}
.toast{background:rgba(59,42,20,.92);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;animation:tin .25s}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:70}
#modal[hidden]{display:none}
textarea{width:100%;height:90px;margin-top:10px;font-family:monospace;font-size:11px;border:2px solid #c99456;border-radius:8px;padding:6px}
#modal .box{background:#fff8e6;border:4px solid #a8743d;border-radius:16px;padding:20px;max-width:340px;text-align:center;font-size:16px}
.mbtns{display:flex;gap:10px;justify-content:center;margin-top:16px}
@media (max-width:820px){
 main{flex-direction:column;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
 #panel{width:100%;position:static}
 #tab{max-height:none}
 #farm{gap:5px;padding:10px}
 .tool{font-size:12px;padding:5px 8px}
 .plot.locked{font-size:9px}.plot.locked b{font-size:16px}
 .brand{font-size:18px}.xpbar{width:80px}
}
</style>
</head>
<body>
<header id="top">
 <div class="brand">🏡 Agro City</div>
 <div class="stat lvl"><span id="lv">1</span><div class="xpbar"><div id="xpfill"></div><span id="xptxt"></span></div></div>
 <div class="stat">🪙 <span id="coins">0</span></div>
 <div class="stat" title="Adubo">🧪 <span id="fert">0</span></div>
  <button class="stat" id="snd" style="color:#fff">🔊</button>
 <button class="stat" id="inst" style="color:#fff;background:#5aa82e;display:none">📲 Instalar</button>
</header>
<main>
 <section id="farmwrap">
  <div id="farmhead"></div>
  <div id="farm"></div>
  <div id="info"></div>
  <div id="tools"></div>
  <div id="seedbar"></div>
 </section>
 <aside id="panel">
  <nav id="tabs">
   <button data-tab="loja">🏪 Loja</button><button data-tab="celeiro">🏚️ Celeiro</button><button data-tab="mapa">🗺️ Mapa</button><button data-tab="ajuda">❓</button>
  </nav>
  <div id="tab"></div>
 </aside>
</main>
<div id="fx"></div>
<div id="toasts"></div>
<div id="modal" hidden><div class="box"><div id="mtext"></div><div class="mbtns" id="mbtns"></div></div></div>

<script>
// ---------- DADOS ----------
const CROPS=[
 {id:'alface',n:'Alface',e:'🥬',lv:1,cost:5,t:30,y:8,p:2,xp:2,h:1},
 {id:'cenoura',n:'Cenoura',e:'🥕',lv:1,cost:10,t:60,y:8,p:3,xp:3,h:1},
 {id:'milho',n:'Milho',e:'🌽',lv:2,cost:20,t:120,y:10,p:4,xp:5,h:1},
 {id:'tomate',n:'Tomate',e:'🍅',lv:3,cost:30,t:180,y:12,p:4,xp:7,h:2},
 {id:'batata',n:'Batata',e:'🥔',lv:4,cost:40,t:240,y:14,p:5,xp:9,h:1},
 {id:'berinjela',n:'Berinjela',e:'🍆',lv:5,cost:55,t:300,y:12,p:7,xp:11,h:2},
 {id:'morango',n:'Morango',e:'🍓',lv:6,cost:80,t:420,y:15,p:8,xp:15,h:3},
 {id:'abobora',n:'Abóbora',e:'🎃',lv:8,cost:120,t:600,y:10,p:20,xp:22,h:1},
 {id:'melancia',n:'Melancia',e:'🍉',lv:10,cost:180,t:900,y:8,p:35,xp:30,h:1},
 {id:'uva',n:'Uva',e:'🍇',lv:12,cost:250,t:1200,y:20,p:20,xp:40,h:3},
];
const C=Object.fromEntries(CROPS.map(c=>[c.id,c]));
const TOTAL=18,FERT_COST=15,MAP_LV=10,KEY='sitioAlegre_v1';
const need=lv=>25+lv*lv*10;
const plotCost=i=>Math.round(150*Math.pow(i-5,1.6)/10)*10;
const plotLv=i=>i-4;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=s=>{s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60);return m?`${m}m ${s%60}s`:`${s}s`};

function newPlot(locked){return {locked,s:'empty',c:null,g:0,h:0,w:0,b:0,wet:0,left:null}}
const WATER=1800,BUG_LV=10; // água dura 30 min; pragas a partir do nível 10
const needsWater=p=>p.s==='grow'&&p.left===null&&!(p.wet>0);
// cresce só enquanto tem água
function growFor(p,dt){if(p.locked||p.s!=='grow'||p.left!==null||!(p.wet>0))return false;const d=Math.min(dt,p.wet);p.g+=d;p.wet=Math.max(0,p.wet-d);return p.g>=C[p.c].t}
function fresh(){return {coins:150,xp:0,lv:1,fert:2,barn:{},seeds:{alface:6,cenoura:3},sel:'alface',tool:'hand',
 plots:Array.from({length:TOTAL},(_,i)=>newPlot(i>=6)),last:Date.now(),tab:'loja'}}

let S,view=-1,selPlot=-1;
const isRipe=p=>p.s==='grow'&&p.left!==null;
function stage(p){if(isRipe(p))return 4;const f=p.g/C[p.c].t;return f<.15?0:f<.45?1:f<.8?2:3}
function ripen(p){const c=C[p.c];const lost=2*(p.w+p.b);const y=Math.max(Math.ceil(c.y/2),c.y-lost);
 p.left=y;p.g=c.t;p.w=0;p.b=0;p.wet=0;return c.y-y}

// ---------- SALVAR ----------
// ---------- RECURSOS DO CELULAR (Capacitor) ----------
const CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const plug=n=>NATIVE&&CAP.registerPlugin?CAP.registerPlugin(n):null;
const Prefs=plug('Preferences'),Notif=plug('LocalNotifications'),Hap=plug('Haptics'),AppP=plug('App');
function buzz(k){try{Hap&&Hap.impact({style:k||'LIGHT'})}catch(e){}}
// sons simples gerados na hora (sem arquivos)
let actx=null,muted=false;
try{muted=localStorage.getItem('sa_mute')==='1'}catch(e){}
function beep(f,d,type,v){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
 const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=v||.08;
 o.connect(g);g.connect(actx.destination);const t=actx.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={plant:()=>beep(520,.12,'triangle'),fix:()=>beep(700,.08,'square',.04),
 harvest:()=>{beep(660,.1,'triangle');setTimeout(()=>beep(880,.15,'triangle'),90)},
 coin:()=>{beep(988,.08,'square',.05);setTimeout(()=>beep(1319,.15,'square',.05),70)},
 level:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle'),i*110)),
 bad:()=>beep(180,.25,'sawtooth',.05)};
// notificação quando a primeira planta amadurecer (com o app fechado)
async function scheduleNotif(){if(!Notif)return;try{
 await Notif.cancel({notifications:[{id:1},{id:2}]});
 let best=Infinity,name='',dry=Infinity,dname='';
 S.plots.forEach(p=>{if(p.s!=='grow'||p.left!==null||!(p.wet>0))return;const r=C[p.c].t-p.g;
  if(r<=p.wet){if(r<best){best=r;name=C[p.c].n}}else if(p.wet<dry){dry=p.wet;dname=C[p.c].n}});
 const L=[];
 if(best<Infinity&&best>20)L.push({id:1,title:'🌾 Agro City',body:`Sua plantação de ${name} está pronta para colher!`,schedule:{at:new Date(Date.now()+best*1000+2000)}});
 if(dry<Infinity&&dry>20)L.push({id:2,title:'💧 Agro City',body:`Sua plantação de ${dname} precisa de água!`,schedule:{at:new Date(Date.now()+dry*1000+2000)}});
 if(L.length)await Notif.schedule({notifications:L});
}catch(e){}}
async function askNotif(){if(!Notif)return;try{const p=await Notif.checkPermissions();if(p.display!=='granted')await Notif.requestPermissions()}catch(e){}}
if(Notif)Notif.addListener('localNotificationActionPerformed',()=>{}).catch?.(()=>{});
// salvar: no celular usa o armazenamento nativo (não é apagado pelo sistema); no navegador usa localStorage
function save(){S.last=Date.now();const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}
 if(Prefs)Prefs.set({key:KEY,value:j}).catch(()=>{})}
async function readSaved(){if(Prefs){try{const r=await Prefs.get({key:KEY});if(r&&r.value)return r.value}catch(e){}}
 try{return localStorage.getItem(KEY)}catch(e){return null}}
// código de backup (para trocar de aparelho)
const toCode=()=>btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function fromCode(c){const d=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(!d.plots||d.plots.length!==TOTAL)throw 0;return d}
async function load(){
 try{const d=JSON.parse(await readSaved());if(d&&d.plots&&d.plots.length===TOTAL){S=d;
  const dt=Math.min((Date.now()-S.last)/1000,6*3600);
  S.plots.forEach(p=>{if(growFor(p,dt))ripen(p)});
  delete S.nb;delete S.dog;if(S.tab==='vizinhos')S.tab='mapa';
  return}}catch(e){}
 S=fresh();
}

// ---------- UI BÁSICA ----------
const $=id=>document.getElementById(id);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('toasts').appendChild(d);
 setTimeout(()=>d.remove(),3200);while($('toasts').children.length>4)$('toasts').firstChild.remove()}
function fly(el,txt,color){if(!el)return;const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='fly';
 d.textContent=txt;if(color)d.style.color=color;d.style.left=(r.left+r.width/2-20)+'px';d.style.top=(r.top+r.height/3)+'px';
 $('fx').appendChild(d);setTimeout(()=>d.remove(),1100)}
function modal(html,btns){$('mtext').innerHTML=html;const b=$('mbtns');b.innerHTML='';
 btns.forEach(x=>{const e=document.createElement('button');e.className='btn '+(x.c||'');e.textContent=x.t;
  e.onclick=()=>{$('modal').hidden=true;x.f&&x.f()};b.appendChild(e)});$('modal').hidden=false}
function addXp(n,el){S.xp+=n;if(el)fly(el,`+${n} XP`,'#ffe066');
 while(S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;SFX.level();buzz('HEAVY');const bonus=S.lv*20;S.coins+=bonus;
  const novas=CROPS.filter(c=>c.lv===S.lv).map(c=>c.e+' '+c.n);
  modal(`<div style="font-size:48px">🎉</div><b style="font-size:22px">Nível ${S.lv}!</b><p style="margin-top:8px">Bônus: +${bonus} 🪙</p>${novas.length?`<p>Nova semente: ${novas.join(', ')}</p>`:''}${S.lv<=13?`<p>Novo canteiro disponível para compra.</p>`:''}${S.lv===MAP_LV?`<p>🗺️ Mapa do Continente liberado!</p>`:''}`,[{t:'Oba!'}]);
  renderTab()}}
function coins(n,el){S.coins+=n;if(n>0)SFX.coin();else if(n<0)SFX.bad();if(el&&n)fly(el,(n>0?'+':'')+n+' 🪙',n>0?'#fff':'#ff8a80')}

// ---------- AÇÕES NA SUA FAZENDA ----------
function plotEl(i){return $('farm').children[i]}
function act(i){
 selPlot=i;
 const p=S.plots[i],el=plotEl(i);let t=S.tool;
 if(p.locked)return buyPlot(i);
 if(t==='hand'){
  if(p.s==='withered')t='weed';else if(p.s==='empty')t='plant';else if(isRipe(p))t='harvest';
  else if(p.b)t='bug';else if(needsWater(p))t='water';else{render();return}
 }
 const c=p.c&&C[p.c];
 switch(t){
  case 'weed':
   if(p.s==='withered'){Object.assign(p,newPlot(false));SFX.fix();buzz();fly(el,'✨ limpo','#fff');setTimeout(()=>fly(el,'+1 XP','#ffe066'),250);addXp(1,null)}
   else if(p.s==='empty')toast('Terreno já está limpo.');
   else if(p.s==='grow')return modal(`Arrancar ${c.e} ${c.n} deste canteiro?`,[{t:'Arrancar',c:'r',f:()=>{Object.assign(p,newPlot(false));render()}},{t:'Cancelar',c:'o'}]);
   break;
  case 'plant':
   if(p.s!=='empty'){toast(p.s==='withered'?'Limpe o mato ✂️ antes de plantar.':'Canteiro ocupado.');break}
   if(!(S.seeds[S.sel]>0)){toast('Sem sementes. Compre na Loja!');setTab('loja');break}
   SFX.plant();S.seeds[S.sel]--;if(!S.seeds[S.sel])delete S.seeds[S.sel];
   Object.assign(p,newPlot(false),{s:'grow',c:S.sel});addXp(1,el);
   if(!S.seeds[S.sel]){const k=Object.keys(S.seeds)[0];if(k)S.sel=k}
   break;
  case 'water': if(p.s==='grow'&&p.left===null){const was=p.wet>0;p.wet=WATER;SFX.fix();fly(el,'💧 30 min','#7fd3ff');if(!was)addXp(1,null)}else toast('Não precisa de água.');break;
  case 'bug': if(p.b){p.b--;SFX.fix();addXp(1,el)}else toast('Sem pragas aqui.');break;
  case 'harvest':
   if(!isRipe(p)){toast('Ainda não está madura.');break}
   S.barn[p.c]=(S.barn[p.c]||0)+p.left;fly(el,`+${p.left} ${c.e}`);SFX.harvest();buzz('MEDIUM');addXp(c.xp,null);
   setTimeout(()=>fly(el,`+${c.xp} XP`,'#ffe066'),250);
   p.h++;
   if(p.h<c.h){p.g=c.t*.6;p.left=null;toast(`${c.n} vai produzir de novo (${p.h}/${c.h}).`)}
   else{p.s='withered';p.left=null}
   break;
  case 'fert':
   if(p.s!=='grow'||isRipe(p)){toast('Adubo só em plantas crescendo.');break}
   if(S.fert<=0){toast('Sem adubo. Compre na Loja!');break}
   S.fert--;p.g=Math.min(c.t,p.g+c.t*.25);fly(el,'⏩ 25%','#9cf06a');if(p.g>=c.t)ripen(p);break;
 }
 render();renderTab();save();
}
function buyPlot(i){
 const first=S.plots.findIndex(p=>p.locked);
 if(i!==first)return toast('Compre os canteiros em ordem.');
 const cost=plotCost(i),lv=plotLv(i);
 if(S.lv<lv)return toast(`Precisa do nível ${lv}.`);
 modal(`Comprar novo canteiro por <b>${cost} 🪙</b>?`,[{t:'Comprar',f:()=>{
  if(S.coins<cost)return toast('Moedas insuficientes.');
  coins(-cost,plotEl(i));S.plots[i].locked=false;addXp(5,plotEl(i));render();save()}},{t:'Cancelar',c:'o'}]);
}

// ---------- RELÓGIO ----------
function tick(dt){
 S.plots.forEach((p,i)=>{
  if(p.locked||p.s!=='grow'||isRipe(p))return;
  const c=C[p.c];const wasWet=p.wet>0;
  if(growFor(p,dt)){const lost=ripen(p);toast(`${c.e} ${c.n} está madura!${lost?` (perdeu ${lost} por pragas)`:''}`);return}
  if(wasWet&&!(p.wet>0)){toast(`💧 ${c.n} ficou sem água e parou de crescer.`);buzz()}
  if(!(p.wet>0))return;
  if(S.lv>=BUG_LV&&stage(p)>=2&&p.b<3&&Math.random()<dt/100)p.b++;
 });
}

// ---------- RENDER ----------
function plotHTML(p,i,own){
 if(p.locked){const first=S.plots.findIndex(q=>q.locked);
  return i===first?`<div><b>➕</b>Nv ${plotLv(i)}<br>${plotCost(i)} 🪙</div>`:`<div><b>🔒</b></div>`}
 if(p.s==='empty')return '';
 if(p.s==='withered')return `<span class="e weeds">🌿☘️<br>☘️🌿</span>`;
 const c=C[p.c],st=stage(p);
 const em=st===0||st===1?'🌱':st===2?'🌿':c.e;
 let h=`<span class="e ${st===4?'ripe':'st'+st}">${em}</span>`;
 const pr='🐛'.repeat(p.b);if(pr)h+=`<span class="probs">${pr}</span>`;
 if(needsWater(p))h+=`<span class="drop">💧</span>`;
 if(st<4)h+=`<div class="pbar"><i style="width:${Math.min(100,p.g/c.t*100)}%"></i></div>`;
 else h+=`<span class="left">${p.left}</span>`;
 return h;
}
function infoFor(p,i){
 if(i<0||!p)return 'Toque num canteiro. Plante e regue 💧 para começar a crescer. A ✋ Mão faz a ação certa automaticamente.';
 if(p.locked)return `Canteiro bloqueado. Nível ${plotLv(i)} · ${plotCost(i)} 🪙`;
 if(p.s==='empty')return 'Canteiro arado e vazio — pronto para plantar.';
 if(p.s==='withered')return 'Terreno com mato depois da colheita. Use ✂️ Limpar para poder plantar de novo.';
 const c=C[p.c];let t=`<b>${c.e} ${c.n}</b> · colheita ${p.h+1}/${c.h} · `;
 if(isRipe(p))t+=`Madura! ${p.left} unidades para colher`;
 else if(needsWater(p))t+=`<b>precisa de água</b> para crescer (faltam ${fmt(c.t-p.g)} de crescimento)`;
 else t+=`madura em ${fmt(c.t-p.g)} · 💧 água por mais ${fmt(p.wet)}`;
 const pr=[];if(p.b)pr.push(`🐛 praga x${p.b}`);
 if(pr.length)t+=' · '+pr.join(', ');
 return t;
}
const OWN_TOOLS=[['hand','✋','Mão'],['plant','🌱','Plantar'],['water','💧','Regar'],['weed','✂️','Limpar'],['bug','🧴','Praga'],['harvest','🧺','Colher'],['fert','🧪','Adubar']];
function render(){
 $('lv').textContent=S.lv;$('coins').textContent=S.coins;$('fert').textContent=S.fert;
 $('xpfill').style.width=(S.xp/need(S.lv)*100)+'%';$('xptxt').textContent=`${S.xp}/${need(S.lv)} XP`;
 const plots=S.plots;
 const farm=$('farm');
 if(farm.children.length!==plots.length){farm.innerHTML='';plots.forEach((_,i)=>{const d=document.createElement('div');d.className='plot';d.onclick=()=>act(i);farm.appendChild(d)})}
 plots.forEach((p,i)=>{const d=farm.children[i];const h=plotHTML(p,i);if(d._h!==h){d.innerHTML=h;d._h=h}
  d.className='plot'+(p.locked?' locked':'')+(needsWater(p)?' dry':'')+(i===selPlot?' sel':'')});
 $('farmhead').innerHTML=`<span>🏡 Sua fazenda</span><span style="font-size:13px">${S.plots.filter(isRipe).length} prontas para colher</span>`;
 $('info').innerHTML=infoFor(plots[selPlot],selPlot);
 const tools=OWN_TOOLS;
 const th=tools.map(([k,e,n])=>`<button class="tool ${S.tool===k?'on':''}" data-t="${k}"><span>${e}</span>${n}</button>`).join('');
 if($('tools')._h!==th){$('tools').innerHTML=th;$('tools')._h=th}
 let sb='';
 {const ks=Object.keys(S.seeds);
  sb='Sementes: '+(ks.length?ks.map(k=>`<button class="chip ${S.sel===k?'on':''}" data-s="${k}">${C[k].e} ${C[k].n} ×${S.seeds[k]}</button>`).join(''):'<span>nenhuma — compre na Loja</span>');}
 if($('seedbar')._h!==sb){$('seedbar').innerHTML=sb;$('seedbar')._h=sb}
}
$('tools').onclick=e=>{const b=e.target.closest('[data-t]');if(b){S.tool=b.dataset.t;render()}};
$('seedbar').onclick=e=>{const b=e.target.closest('[data-s]');if(b){S.sel=b.dataset.s;if(S.tool!=='hand')S.tool='plant';render()}};

function setTab(t){S.tab=t;renderTab()}
$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)};
function renderTab(){
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
 let h='';
 if(S.tab==='loja'){
  h='<h3>🌱 Sementes</h3>'+CROPS.map(c=>{const ok=S.lv>=c.lv;
   return `<div class="card ${ok?'':'off'}"><div class="ic">${c.e}</div><div class="tx"><b>${c.n}</b>${ok?'':` · 🔒 Nv ${c.lv}`}<br>
   ${c.cost} 🪙 · ${fmt(c.t)} · ${c.y} × ${c.p}🪙${c.h>1?` · ${c.h} colheitas`:''}<br>+${c.xp} XP por colheita</div>
   <div class="bs"><button class="btn" data-a="buy" data-k="${c.id}" data-q="1" ${ok&&S.coins>=c.cost?'':'disabled'}>+1</button>
   <button class="btn" data-a="buy" data-k="${c.id}" data-q="5" ${ok&&S.coins>=c.cost*5?'':'disabled'}>+5</button></div></div>`}).join('')+
  `<h3>🧰 Itens</h3>
  <div class="card"><div class="ic">🧪</div><div class="tx"><b>Adubo</b><br>Adianta 25% do crescimento. Você tem ${S.fert}.</div><div class="bs"><button class="btn" data-a="fert" ${S.coins>=FERT_COST?'':'disabled'}>${FERT_COST} 🪙</button></div></div>`;
 }else if(S.tab==='celeiro'){
  const ks=Object.keys(S.barn).filter(k=>S.barn[k]>0);
  const tot=ks.reduce((a,k)=>a+S.barn[k]*C[k].p,0);
  h=ks.length?`<div class="card"><div class="tx"><b>Total no celeiro: ${tot} 🪙</b></div><button class="btn o" data-a="sellall">Vender tudo</button></div>`+
   ks.map(k=>`<div class="card"><div class="ic">${C[k].e}</div><div class="tx"><b>${C[k].n}</b> ×${S.barn[k]}<br>${C[k].p} 🪙 cada · ${S.barn[k]*C[k].p} 🪙</div>
   <div class="bs"><button class="btn" data-a="sell" data-k="${k}" data-q="1">Vender 1</button><button class="btn o" data-a="sell" data-k="${k}" data-q="all">Todos</button></div></div>`).join('')
   :'<div class="empty">🏚️ Celeiro vazio.<br>Colha algo para encher!</div>';
 }else if(S.tab==='mapa'){
  const ok=S.lv>=MAP_LV;
  h=`<div class="empty" style="padding:24px 10px"><div style="font-size:64px;${ok?'':'filter:grayscale(1);opacity:.6'}">🗺️</div>
   <b style="font-size:18px;color:#6e4520">Mapa do Continente</b>
   <p style="margin-top:8px">Explore as terras ao redor da sua fazenda e encontre vizinhos.</p>
   ${ok?'<p style="margin-top:10px"><b>🚧 Em construção!</b><br>Chega numa próxima atualização.</p>'
     :`<p style="margin-top:10px">🔒 Libera no <b>nível ${MAP_LV}</b></p>
       <div class="xpbar" style="width:80%;margin:10px auto;height:14px"><div style="height:100%;background:linear-gradient(#9cf06a,#4fb320);width:${Math.min(100,(S.lv-1)/(MAP_LV-1)*100)}%"></div></div>
       <p>Você está no nível ${S.lv}</p>`}</div>`;
 }else{
  h=`<div class="help"><h3>Como jogar</h3>
  <p>🌱 <b>Plante</b> sementes da Loja nos canteiros. Elas crescem em tempo real, mesmo com o jogo fechado.</p>
  <p>💧 A planta só cresce <b>com água</b>. Depois de plantar, regue para começar o crescimento. Cada rega dura <b>30 minutos</b>: quando a água acaba, a planta para de crescer até você regar de novo.</p>
  <p>🐛 A partir do <b>nível 10</b> aparecem <b>pragas</b> durante o crescimento. Cada praga que sobrar até a colheita tira 2 unidades.</p>
  <p>🧺 <b>Colha</b> quando madura, guarde no Celeiro e <b>venda</b> para ganhar moedas. Algumas plantas dão várias colheitas.</p>
  <p>☘️ Depois da última colheita o terreno fica com <b>mato</b>: use ✂️ <b>Limpar</b> para poder plantar de novo.</p>
  <p>⭐ Tudo dá <b>XP</b>. Subir de nível libera sementes novas e canteiros para comprar.</p>
  <p>🧪 O <b>adubo</b> adianta o crescimento de uma planta.</p>
  <p>🗺️ No nível ${MAP_LV} libera o <b>Mapa do Continente</b> para explorar e encontrar vizinhos (em breve).</p>
  <p>✋ A <b>Mão</b> escolhe a ação certa sozinha — ideal no celular.</p>
  <h3 style="margin-top:14px">📲 Instalar no celular</h3>
  <p><b>Android:</b> no Chrome, toque em ⋮ → <b>Instalar app</b> (ou "Adicionar à tela inicial").<br><b>iPhone:</b> no Safari, toque em compartilhar → <b>Adicionar à Tela de Início</b>.</p>
  <h3 style="margin-top:14px">💾 Backup do progresso</h3>
  <p>Para passar seu jogo para outro celular: copie o código aqui e cole no outro aparelho.</p>
  <p><button class="btn" data-a="export">Copiar meu código</button> <button class="btn o" data-a="import">Colar código</button></p>
  <p style="margin-top:14px"><button class="btn r" data-a="reset">Recomeçar do zero</button></p>
  <p style="font-size:12px;color:#8a6a40">Agro City v1.0 · funciona sem internet · nenhum dado sai do seu aparelho.</p></div>`;
 }
 $('tab').innerHTML=h;
}
$('tab').onclick=e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,k=b.dataset.k,q=b.dataset.q;
 if(a==='buy'){const n=+q,c=C[k];if(S.coins<c.cost*n)return;S.coins-=c.cost*n;S.seeds[k]=(S.seeds[k]||0)+n;S.sel=k;fly(b,`+${n} ${c.e}`);toast(`Comprou ${n} semente(s) de ${c.n}.`)}
 if(a==='fert'){if(S.coins<FERT_COST)return;S.coins-=FERT_COST;S.fert++;fly(b,'+1 🧪')}
 if(a==='sell'){const n=q==='all'?S.barn[k]:1;S.barn[k]-=n;const v=n*C[k].p;coins(v,b);if(!S.barn[k])delete S.barn[k]}
 if(a==='sellall'){let v=0;for(const x in S.barn)v+=S.barn[x]*C[x].p;S.barn={};coins(v,b);toast(`Vendeu tudo por ${v} 🪙!`)}
 if(a==='export'){const c=toCode();
  const done=ok=>modal(ok?'✅ Código copiado! Guarde ou cole no outro aparelho.':'Copie o código abaixo:'+`<textarea readonly>${c}</textarea>`,[{t:'OK'}]);
  try{navigator.clipboard.writeText(c).then(()=>done(true),()=>done(false))}catch(e){done(false)}return}
 if(a==='import'){modal('Cole seu código de backup:<textarea id="imp"></textarea>',[{t:'Carregar',f:()=>{
   const v=(document.getElementById('imp')||{}).value||'';
   try{S=fromCode(v);view=-1;selPlot=-1;save();render();renderTab();toast('✅ Progresso carregado!')}catch(e){toast('Código inválido.')}}},{t:'Cancelar',c:'o'}]);
  // o textarea é lido antes do modal fechar
  const btn=$('mbtns').firstChild,orig=btn.onclick;btn.onclick=()=>{const v=document.getElementById('imp').value;$('modal').hidden=true;
   try{S=fromCode(v);view=-1;selPlot=-1;save();render();renderTab();toast('✅ Progresso carregado!')}catch(e){toast('Código inválido.')}};return}
 if(a==='reset'){return modal('Apagar todo o progresso e recomeçar?',[{t:'Recomeçar',c:'r',f:()=>{S=fresh();view=-1;selPlot=-1;save();render();renderTab()}},{t:'Cancelar',c:'o'}])}
 render();renderTab();save();
};

// ---------- INÍCIO ----------
function resume(){const dt=Math.min((Date.now()-S.last)/1000,6*3600);
 if(dt>5)S.plots.forEach(p=>{if(growFor(p,dt))ripen(p)});
 last=performance.now();if(Notif)Notif.cancel({notifications:[{id:1},{id:2}]}).catch(()=>{});render()}
function pause(){save();scheduleNotif()}
let last=performance.now(),n=0;
load().then(()=>{
 render();renderTab();updSnd();askNotif();if(Notif)Notif.cancel({notifications:[{id:1},{id:2}]}).catch(()=>{});
 setInterval(()=>{const now=performance.now();const dt=Math.min(5,(now-last)/1000);last=now;tick(dt);render();
  if(++n%5===0){save();if(S.tab==='celeiro')renderTab()}},1000);
 document.addEventListener('visibilitychange',()=>{document.hidden?pause():resume()});
 if(AppP){
  AppP.addListener('pause',pause);AppP.addListener('resume',resume);
  AppP.addListener('backButton',()=>{
   if(!$('modal').hidden){$('modal').hidden=true;return}
   modal('Sair do jogo? Seu progresso está salvo.',[{t:'Sair',c:'r',f:()=>{pause();AppP.exitApp()}},{t:'Ficar',c:'o'}]);
  });
 }
});
// ---------- PWA (instalar e funcionar offline) ----------
let instEv=null;
if(!NATIVE){
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;$('inst').style.display=''});
 window.addEventListener('appinstalled',()=>{$('inst').style.display='none';toast('📲 Agro City instalado!')});
 $('inst').onclick=async()=>{if(!instEv)return;instEv.prompt();try{await instEv.userChoice}catch(e){}instEv=null;$('inst').style.display='none'};
 try{if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtrl)toast('✨ Jogo atualizado para a nova versão!')});
 }}catch(e){}
}
function updSnd(){$('snd').textContent=muted?'🔇':'🔊'}
$('snd').onclick=()=>{muted=!muted;try{localStorage.setItem('sa_mute',muted?'1':'0')}catch(e){}updSnd();if(!muted)SFX.coin()};
</script>
